apis:
- name: FLO Store (Shopify Storefront MCP)
  description: >-
    The only live, anonymously callable machine-readable surface in FLO's estate. FLO's
    hardware and accessories store runs on Shopify, and that platform serves a Model Context
    Protocol server at https://store.flo.com/api/mcp - protocol version 2025-06-18, serverInfo
    "storefront-renderer" 0.1.0 - exposing five tools over FLO's own product catalogue, store
    policies and cart/checkout flow, plus public JSON product and collection feeds. It is
    platform-provided rather than FLO-authored, and it is commerce only: it says nothing about
    charging sessions, station telemetry, roaming (OCPI) or demand response (OpenADR), all of
    which remain partner-mediated with no published contract.
