- id: greenbutton-espi
  name: Green Button / ESPI
  conforms: false
  applicable: false
  evidence: >-
    Ontario's Green Button regulation binds electricity and natural gas
    utilities. FLO is a charge point operator, not a licensed distributor or
    retailer, so the mandate does not attach. No Green Button or ESPI surface
    exists on flo.com.
- id: cdr-energy
  name: Consumer Data Right (energy, Australia)
  conforms: false
  applicable: false
  evidence: Different jurisdiction; FLO has no Australian retail energy operation and is not a designated data holder.
- id: iso-15118
  name: ISO 15118
  conforms: unknown
  evidence: Not named by FLO on any page probed. Its Plug and Charge page names only the CCS connector and GM's apps.
