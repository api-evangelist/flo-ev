  conforms: true
  layer: web identity (platform-inherited)
  evidence: 'https://store.flo.com/.well-known/oauth-authorization-server returns valid JSON metadata (HTTP 200)'
  source: well-known/flo-ev-store-oauth-authorization-server.json
- id: rfc9728-oauth-protected-resource-metadata
  name: RFC 9728 OAuth 2.0 Protected Resource Metadata
  conforms: true
  layer: web identity (platform-inherited)
  evidence: 'https://store.flo.com/.well-known/oauth-protected-resource declares store.flo.com as the resource, shopify.com as its authorization server, bearer in header'
