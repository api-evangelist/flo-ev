generated: '2026-07-27'
method: searched
source: >-
  FLO's own product/insight pages plus live discovery documents and protocol
  probes performed 2026-07-27
note: >-
  FLO is a standards-participating company at the machine-to-machine layer
  (OCPP down to the hardware, OCPI sideways to peer networks, OpenADR up to
  utility DERMS) and a standards CONSUMER at the web layer (OIDC, OAuth 2.0,
  MCP - all inherited from the Shopify and Salesforce platforms it hosts on
  flo.com names). It conforms to no API-design standard of its own because it
  publishes no API of its own.
standards:
- id: ocpp-1.6j
  name: Open Charge Point Protocol 1.6J
  conforms: true
  layer: station-to-network
  evidence: 'FLO SmartDC spec sheet networking block states "OCPP1.6J"'
  source: https://www.flo.com/products/hardware/smartdc/
  note: Hardware interoperability - a purchased FLO station can be operated on a third-party network. Not a FLO-published API.
- id: ocpi
  name: Open Charge Point Interface
  conforms: true
  layer: network-to-network roaming
  evidence: FLO names OCPI as the roaming communication protocol in its own roaming explainer and links to evroaming.org
  source: https://www.flo.com/insights/ev-charging-roaming/
  note: >-
    No OCPI credentials/versions endpoint, party ID or base URL is published.
    Probed ocpi.flo.com, emsp.flo.com and cpo.flo.com - none resolve. Roaming is
    bilateral and contractual.
- id: openadr-2.0
  name: OpenADR 2.0
  conforms: true
  layer: utility demand response / smart grid
  evidence: '"Through OpenADR 2.0 or FLO''s flexible API, we support integration with utility demand response and smart grid programs to control EV charging stations."'
  source: https://www.flo.com/business/utilities/
  note: The only first-party mention of a "FLO API" anywhere on flo.com. No endpoint, reference or onboarding path accompanies it.
- id: plug-and-charge
  name: Plug and Charge (CCS connector, GM)
  conforms: true
  layer: driver authentication at the charger
  evidence: FLO describes "FLO's autocharge software" working with the Combined Charging System connector and GM's myBrand apps
  source: https://www.flo.com/news/flo-enables-gm-plug-and-charge/
  note: ISO 15118 is NOT named by FLO on that page and is not attributed here.
- id: oidc-discovery
  name: OpenID Connect Discovery 1.0
  conforms: true
  layer: web identity (platform-inherited)
  evidence: 'Valid JSON discovery documents at https://store.flo.com/.well-known/openid-configuration (Shopify) and https://network.flo.com/.well-known/openid-configuration (Salesforce), both HTTP 200'
  source: well-known/flo-ev-well-known.yml
- id: rfc8414-oauth-authorization-server-metadata
