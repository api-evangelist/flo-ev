- id: openapi
  name: OpenAPI
  conforms: false
  evidence: >-
    No OpenAPI/Swagger document found on any flo.com host. Probed /openapi.json,
    /openapi.yaml, /swagger.json, /swagger/v1/swagger.json, /api-docs,
    /v1/openapi.json and /docs against www, auth, csnms, edge and
