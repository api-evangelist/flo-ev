source: live probes of every flo.com host discovered in this round
note: >-
  FLO publishes no first-party developer API, but three of its hosts serve real
  machine-readable discovery documents from the SaaS platforms FLO runs on:
  store.flo.com (Shopify commerce) and network.flo.com (Salesforce Experience
  Cloud). Those documents are recorded verbatim below because they are live,
  anonymous and served under a flo.com host - but they describe PLATFORM identity
  infrastructure, not a FLO-authored API program. trust.flo.com is a Vanta-hosted
  single-page app whose catch-all route returns HTTP 200 with an HTML shell for
  every path, so its /.well-known/ "200"s are false positives and are recorded as
  such.
