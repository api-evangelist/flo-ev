name: FLO
kind: company
description: >-
  FLO is a Quebec City headquartered electric vehicle charging company, founded in 2009 as
  AddEnergie (addenergie.com now redirects to flo.com), that designs and manufactures its own
  Level 2 and DC fast charging hardware and operates one of the largest public charging networks
  in North America. FLO sits on the demand side of the electricity value chain rather than inside
  the regulated utility layer: it is a charge point operator and e-mobility service provider, not
  a distributor, transmitter or retailer, so Canada's energy-data obligations do not reach it.
  Ontario's Green Button regulation binds Ontario electricity and natural gas utilities, and
  Australia's Consumer Data Right for energy is a different jurisdiction entirely; neither applies
  to FLO, and FLO publishes no consumer energy data API of any kind. Its API posture is closed and
  partner-mediated. flo.com has no developer subdomain and no published API reference:
  developer.flo.com, developers.flo.com, api.flo.com, docs.flo.com and data.flo.com all fail to
  resolve, and /developers, /api, /openapi.json, /swagger.json and /api-docs all return 404. FLO
  does name real interoperability standards on its own pages - OCPP 1.6J on the station-to-network
  side, OCPI for roaming with partner networks, and OpenADR 2.0 alongside "FLO's flexible API" for
  utility demand response and smart grid integration - but each of those is reached through a
  commercial agreement rather than a signup form. Customer charging and session data is reachable
  only by the account holder through the account.flo.com login, and FLO publishes no open market,
  grid or station-location data feed under its own name.
