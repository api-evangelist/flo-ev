actions:
  openapiHarvested: false
  specsCount: 0
  openapiDirectory: null
  apisListed: 0
  apisYmlCreated: true
  reason: >-
    No machine-readable API contract of any kind exists to harvest. Nothing was fabricated:
    apis[] is deliberately empty because FLO documents no public API, and the openapi/
    directory was omitted because no spec was found. All real, verified public surfaces are
    recorded in the common[] block of apis.yml.
